<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Over-articulation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css')}}">
</head>
<body>
    <header class="container pt-5 pb-4">
        <a class="btn btn-back" href="/" role="button">
            <i class="bi bi-arrow-left-short"></i>
            Back to exercises
        </a>
        <h1 class="display-5 fw-bold">Over Articulation</h1>
        <p>Pick text below, read it aloud, over articulate every word beyond what feels natural.</p>
    </header>
    <div class="container">
        {% for b in books %}
        <div class="card mb-4 p-3">
            <h2 class="card-title h4">{{b.title}}</h2>
            <p>{{b.preview}}</p>
            <a class="btn btn-start-reading" href="/over-articulation/{{b.id}}" role="button">
                Start reading
                <i class="bi bi-arrow-right-short"></i>
            </a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
