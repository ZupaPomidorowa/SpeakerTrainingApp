<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercises for speakers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css')}}">
</head>
<body>
    <header class="container pt-5 pb-4">
        <h1 class="display-5 fw-bold">Exercises for speakers</h1>
    </header>
    <div class="container pb-5 ">
        <div class="row row-cols-2 g-4">
            {% for ex in exercises %}
            <div class="col">
                <div class="card main-card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h2 class="card-title h4">{{ex.title}}</h2>
                        <a class="btn btn-start w-100 mt-auto" href="{{ex.url}}" role="button">Start exercise</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
