<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Words</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css')}}">
</head>
<body>
    <header class="container pt-5 pb-4">
        <a class="btn btn-back" href="/" role="button">
            <i class="bi bi-arrow-left-short"></i>
            Back to exercises
        </a>
        <h1 class="display-5 fw-bold">Random Words</h1>
        <p>You get three random words and 30 seconds to make speech using them.</p>
    </header>
    <div class="container text-center">
        <div class="card p-3">
            <div class="karaoke-timer" id="timer">30s</div>
            <div class="d-flex justify-content-center gap-3 mt-4">
                <span class="badge-word align-self-start mb-3">{{ words[0] }}</span>
                <span class="badge-word align-self-start mb-3">{{ words[1] }}</span>
                <span class="badge-word align-self-start mb-3">{{ words[2] }}</span>
            </div>
            <a class="btn btn-start align-self-center mt-2" id="start">
                <i class="bi bi-caret-right"></i>
                Start
            </a>
        </div>
        <a class="btn btn-new-exercise mt-4 mb-4" href="" role="button">
            <i class="bi bi-shuffle"></i>
            New exercise
        </a>
    </div>
    <script>
        const SECONDS = 30;

        const timerEl   = document.getElementById("timer");
        const startBtn = document.getElementById("start");

        let timeLeft = SECONDS;
        let timerId = null;

        function tick() {
            timeLeft--;
            timerEl.textContent = timeLeft + "s";
            if (timeLeft <= 0) {
                clearInterval(timerId);
                timerId = null;
                timerEl.textContent = "Time's up!"
            }
        }

        function start() {
            if (timerId) return;
            timeLeft = SECONDS;
            timerEl.textContent = timeLeft + "s";
            timerId = setInterval(tick, 1000);
        }

        startBtn.addEventListener("click", start);
    </script>
</body>
</html>
